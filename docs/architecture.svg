<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Aegis data reliability platform architecture</title>
  <desc id="desc">Five-stage architecture from synthetic operational data through trust controls, DuckDB and dbt modeling, grounded decision intelligence, and a seven-page Power BI report. Reproducibility and testing span every stage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="55%" stop-color="#0d1b31"/>
      <stop offset="100%" stop-color="#111d35"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#102846"/>
      <stop offset="100%" stop-color="#162440"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6e92c4"/>
    </marker>
    <style>
      .title { fill: #f4f8ff; font: 700 30px Inter, Segoe UI, Arial, sans-serif; }
      .subtitle { fill: #9fb1c9; font: 400 15px Inter, Segoe UI, Arial, sans-serif; }
      .step { fill: #ffffff; font: 700 13px Inter, Segoe UI, Arial, sans-serif; letter-spacing: 1.2px; }
      .label { fill: #eaf1fb; font: 600 14px Inter, Segoe UI, Arial, sans-serif; }
      .detail { fill: #9fb1c9; font: 400 12px Inter, Segoe UI, Arial, sans-serif; }
      .number { fill: #081426; font: 800 14px Inter, Segoe UI, Arial, sans-serif; }
      .chip { fill: #dbe8f8; font: 600 12px Inter, Segoe UI, Arial, sans-serif; }
      .arrow-label { fill: #7894bb; font: 600 11px Inter, Segoe UI, Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect width="1400" height="820" rx="24" fill="url(#background)"/>
  <circle cx="70" cy="67" r="21" fill="#2f80ed"/>
  <path d="M59 68 L67 76 L82 57" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="62" class="title">Aegis Data Reliability Platform</text>
  <text x="104" y="86" class="subtitle">Evidence-led incident detection, trusted analytics, and governed AI decision support</text>

  <g filter="url(#shadow)">
    <rect x="42" y="132" width="232" height="520" rx="16" fill="#10213a" stroke="#294465"/>
    <rect x="314" y="132" width="232" height="520" rx="16" fill="#10213a" stroke="#294465"/>
    <rect x="586" y="132" width="232" height="520" rx="16" fill="#10213a" stroke="#294465"/>
    <rect x="858" y="132" width="232" height="520" rx="16" fill="#10213a" stroke="#294465"/>
    <rect x="1130" y="132" width="232" height="520" rx="16" fill="#10213a" stroke="#294465"/>
  </g>

  <g>
    <rect x="42" y="132" width="232" height="70" rx="16" fill="#173f70"/>
    <rect x="42" y="186" width="232" height="16" fill="#173f70"/>
    <circle cx="70" cy="167" r="16" fill="#60a5fa"/>
    <text x="70" y="172" text-anchor="middle" class="number">1</text>
    <text x="95" y="172" class="step">DATA SOURCES</text>

    <rect x="314" y="132" width="232" height="70" rx="16" fill="#125867"/>
