    <text x="348" y="579" class="detail">DATA_INCIDENT</text>
    <text x="348" y="598" class="detail">BUSINESS_INCIDENT</text>
  </g>

  <g>
    <rect x="604" y="224" width="196" height="64" rx="10" fill="#202b51" stroke="#52639a"/>
    <text x="620" y="250" class="label">Generated files</text>
    <text x="620" y="270" class="detail">CSV / Parquet landing data</text>
    <rect x="604" y="301" width="196" height="64" rx="10" fill="#202b51" stroke="#52639a"/>
    <text x="620" y="327" class="label">DuckDB Bronze</text>
    <text x="620" y="347" class="detail">Source-aligned tables</text>
    <rect x="604" y="378" width="196" height="64" rx="10" fill="#202b51" stroke="#52639a"/>
    <text x="620" y="404" class="label">Silver SQL + dbt</text>
    <text x="620" y="424" class="detail">Clean, reconciled entities</text>
    <rect x="604" y="455" width="196" height="64" rx="10" fill="#202b51" stroke="#52639a"/>
