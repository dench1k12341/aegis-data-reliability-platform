    <text x="76" y="271" class="detail">Orders, items, payments</text>
    <rect x="60" y="308" width="196" height="70" rx="10" fill="#142b48" stroke="#28537c"/>
    <text x="76" y="334" class="label">Logistics</text>
    <text x="76" y="355" class="detail">Shipments, tracking, hubs</text>
    <rect x="60" y="392" width="196" height="70" rx="10" fill="#142b48" stroke="#28537c"/>
    <text x="76" y="418" class="label">Customer support</text>
    <text x="76" y="439" class="detail">Cases, SLA, CSAT</text>
    <rect x="60" y="476" width="196" height="70" rx="10" fill="#142b48" stroke="#28537c"/>
    <text x="76" y="502" class="label">Product telemetry</text>
    <text x="76" y="523" class="detail">Sessions and app events</text>
