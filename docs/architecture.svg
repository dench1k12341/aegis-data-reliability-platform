    <text x="1164" y="291" class="detail">Shared date + KPI model</text>
    <rect x="1148" y="328" width="196" height="64" rx="10" fill="#3d2c1b" stroke="#9a6632"/>
    <text x="1164" y="354" class="label">Executive + Operations</text>
    <text x="1164" y="374" class="detail">Health and incident context</text>
    <rect x="1148" y="405" width="196" height="64" rx="10" fill="#3d2c1b" stroke="#9a6632"/>
    <text x="1164" y="431" class="label">Commerce + CX</text>
    <text x="1164" y="451" class="detail">Revenue and customer impact</text>
    <rect x="1148" y="482" width="196" height="64" rx="10" fill="#3d2c1b" stroke="#9a6632"/>
