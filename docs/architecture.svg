    <line x1="550" y1="390" x2="576" y2="390" stroke="#6e92c4" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="822" y1="390" x2="848" y2="390" stroke="#6e92c4" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1094" y1="390" x2="1120" y2="390" stroke="#6e92c4" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="42" y="686" width="1320" height="94" rx="16" fill="url(#rail)" stroke="#294465"/>
    <text x="66" y="720" class="step">REPRODUCIBILITY &amp; DELIVERY</text>
    <rect x="66" y="737" width="196" height="28" rx="14" fill="#173f70"/>
    <text x="164" y="756" text-anchor="middle" class="chip">Deterministic seed 42</text>
    <rect x="282" y="737" width="244" height="28" rx="14" fill="#125867"/>
    <text x="404" y="756" text-anchor="middle" class="chip">pytest warehouse contracts</text>
