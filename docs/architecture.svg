    <text x="620" y="579" class="detail">Incident command center</text>
    <text x="620" y="598" class="detail">Power BI CSV exports</text>
  </g>

  <g>
    <rect x="876" y="224" width="196" height="64" rx="10" fill="#35294f" stroke="#72579b"/>
    <text x="892" y="250" class="label">Incident registry</text>
    <text x="892" y="270" class="detail">Trusted analytical facts</text>
    <rect x="876" y="301" width="196" height="64" rx="10" fill="#35294f" stroke="#72579b"/>
